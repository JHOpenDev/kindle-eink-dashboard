<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1072px; height: 1448px;
    background: #ffffff; color: #000000;
    font-family: "PingFang SC", "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  .page { display: flex; flex-direction: column; height: 100%; padding: 60px 70px; }
  .date { font-size: 52px; font-weight: 600; letter-spacing: 2px; }
  .lunar-line { font-size: 34px; color: #444; margin-top: 10px; }
  .clock { font-size: 300px; font-weight: 700; line-height: 1; margin-top: 40px;
           font-variant-numeric: tabular-nums; letter-spacing: -8px; }
  .clock .sec { font-size: 110px; font-weight: 500; letter-spacing: 0; color: #333; }
  hr { border: none; border-top: 6px solid #000; margin: 46px 0 40px; }
  .weather { display: flex; align-items: flex-end; justify-content: space-between; }
  .w-temp { font-size: 190px; font-weight: 700; line-height: 1; }
  .w-temp sup { font-size: 80px; }
  .w-side { text-align: right; font-size: 44px; line-height: 1.5; }
  .cards { display: flex; gap: 34px; margin-top: auto; }
  .card { flex: 1; border: 5px solid #000; padding: 26px 30px; }
  .card h3 { font-size: 32px; letter-spacing: 4px; margin-bottom: 16px; }
  .card p { font-size: 36px; line-height: 1.55; }
  .footer { margin-top: 44px; font-size: 26px; color: #888; text-align: center; }
</style>
<script src="weather_data.js"></script>
</head>
<body>
<div class="page">
  <div>
    <div class="date" id="date">2026年11月8日 星期六</div>
    <div class="lunar-line" id="lunar">宜折腾 · 忌固件升级</div>
  </div>
  <div class="clock" id="clock">09:41<span class="sec" id="sec">:00</span></div>
  <hr>
  <div class="weather">
    <div class="w-temp"><span id="w-temp">--</span><sup>°C</sup></div>
    <div class="w-side"><span id="w-city">北京</span> · <span id="w-desc">--</span><br>
      湿度 <span id="w-hum">--</span>% · 风 <span id="w-wind">--</span> km/h<br>
      今日 <span id="w-range">--</span>°C · <span id="w-ddesc">--</span></div>
  </div>
  <div class="cards">
    <div class="card">
      <h3>今日待办</h3>
      <p>· 整理墨水屏看板<br>· 回复三封邮件<br>· 跑步 5 公里</p>
    </div>
    <div class="card">
      <h3>每日一句</h3>
      <p>慢就是快。<br>墨水屏教会我们等待。</p>
    </div>
  </div>
  <div class="footer">kindle-dash · rendered on Mac · 192.168.1.210:8899</div>
</div>
<script>
  function pad(n){ return String(n).padStart(2,'0'); }
  function tick(){
    const d = new Date();
    const week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
    document.getElementById('date').textContent =
      `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${week}`;
    if (window.WEATHER) {
      const W = window.WEATHER;
      document.getElementById('w-temp').textContent = W.temp;
      document.getElementById('w-city').textContent = W.city;
      document.getElementById('w-desc').textContent = W.desc;
      document.getElementById('w-hum').textContent = W.humidity;
      document.getElementById('w-wind').textContent = W.wind;
      document.getElementById('w-range').textContent = W.tmin + '~' + W.tmax;
      document.getElementById('w-ddesc').textContent = W.ddesc;
    }
    document.getElementById('clock').innerHTML =
      `${pad(d.getHours())}:${pad(d.getMinutes())}<span class="sec">:${pad(d.getSeconds())}</span>`;
  }
  tick();
</script>
</body>
</html>
